---
id: elasticsearch-exposed
info:
  name: Elasticsearch 未授权访问
  severity: high
  category: 配置错误
requests:
  - path: /_cat/indices
    matchers-condition: or
    matchers:
      - type: word
        words: ["green ", "yellow ", "health status index"]
        condition: or
  - path: /
    matchers-condition: and
    matchers:
      - type: word
        words: ["\"cluster_name\"", "\"lucene_version\""]
        condition: and
---
id: prometheus-metrics
info:
  name: Prometheus /metrics 暴露
  severity: low
  category: 信息泄露
requests:
  - path: /metrics
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: word
        words: ["# HELP", "# TYPE"]
        condition: and
