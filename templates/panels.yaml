id: phpmyadmin-panel
info:
  name: phpMyAdmin 管理面板暴露
  severity: medium
  category: 配置错误
requests:
  - paths:
      - /phpmyadmin/
      - /pma/
      - /phpMyAdmin/
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: word
        words: ["phpMyAdmin", "pma_"]
        condition: or
---
id: adminer-panel
info:
  name: Adminer 数据库面板暴露
  severity: medium
  category: 配置错误
requests:
  - paths:
      - /adminer.php
      - /adminer/
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: word
        words: ["Adminer", "Login - Adminer"]
        condition: or
---
id: jenkins-panel
info:
  name: Jenkins 面板暴露
  severity: high
  category: 配置错误
requests:
  - path: /
    matchers-condition: or
    matchers:
      - type: header
        headers: ["X-Jenkins"]
      - type: word
        words: ["Dashboard [Jenkins]", "jenkins-session"]
        condition: or
