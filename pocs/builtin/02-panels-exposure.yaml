id: wvs-spring-actuator-exposure
info:
  name: Spring Boot Actuator 暴露
  author: huocai250
  severity: high
  category: 信息泄露
  description: Actuator 管理端点未授权访问，可能泄露环境变量/配置/堆转储。
  tags: spring,actuator,exposure
  metadata:
    product: [springboot, actuator]
http:
  - method: GET
    path:
      - "{{BaseURL}}/actuator"
      - "{{BaseURL}}/actuator/health"
      - "{{BaseURL}}/actuator/env"
      - "{{BaseURL}}/actuator/heapdump"
      - "{{BaseURL}}/env"
      - "{{BaseURL}}/jolokia"
    matchers-condition: or
    matchers:
      - type: word
        words: ["activeProfiles", "spring.application", "heapdump", "jolokia"]
        part: body
      - type: word
        words: ["application/json"]
        part: header
    stop-at-first-match: true
---
id: wvs-swagger-ui-exposure
info:
  name: Swagger / OpenAPI 文档暴露
  author: huocai250
  severity: medium
  category: 信息泄露
  description: API 文档端点未授权访问，暴露接口定义与参数。
  tags: swagger,openapi,api,exposure
http:
  - method: GET
    path:
      - "{{BaseURL}}/swagger-ui.html"
      - "{{BaseURL}}/swagger-ui/index.html"
      - "{{BaseURL}}/v2/api-docs"
      - "{{BaseURL}}/v3/api-docs"
      - "{{BaseURL}}/api/swagger-ui.html"
      - "{{BaseURL}}/api-docs"
    matchers-condition: or
    matchers:
      - type: word
        words: ["Swagger UI", "swagger", "openapi"]
        part: all
      - type: regex
        regex: ['"(swagger|openapi|paths|info)"\s*:']
    stop-at-first-match: true
---
id: wvs-graphql-introspection
info:
  name: GraphQL 端点开放（可 introspection）
  author: huocai250
  severity: medium
  category: 配置错误
  description: GraphQL 端点接受 introspection 查询，可枚举 schema。
  tags: graphql,api,exposure
http:
  - method: POST
    path:
      - "{{BaseURL}}/graphql"
      - "{{BaseURL}}/v1/graphql"
      - "{{BaseURL}}/api/graphql"
      - "{{BaseURL}}/query"
    headers:
      Content-Type: application/json
    body: '{"query":"{__schema{types{name}}}"}'
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: word
        words: ["__schema", "types"]
    stop-at-first-match: true
---
id: wvs-phpinfo-exposure
info:
  name: phpinfo 页面暴露
  author: huocai250
  severity: low
  category: 信息泄露
  description: 常见的 phpinfo 文件可直接访问，泄露 PHP 环境与扩展信息。
  tags: phpinfo,exposure,info
http:
  - method: GET
    path:
      - "{{BaseURL}}/phpinfo.php"
      - "{{BaseURL}}/info.php"
      - "{{BaseURL}}/test.php"
      - "{{BaseURL}}/php_info.php"
      - "{{BaseURL}}/i.php"
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: word
        words: ["PHP Version"]
    stop-at-first-match: true
---
