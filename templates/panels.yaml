id: swagger-ui
info:
  name: Swagger UI / API 文档暴露
  severity: low
  category: 信息泄露
requests:
  - paths:
      - /swagger-ui.html
      - /swagger/index.html
      - /api-docs
      - /swagger.json
      - /openapi.json
    matchers-condition: or
    matchers:
