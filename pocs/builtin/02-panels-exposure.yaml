id: wvs-backup-files
info:
  name: 常见备份/源码压缩包暴露
  author: huocai250
  severity: high
  category: 信息泄露
  description: 常见网站备份包直接可下载，可能包含源码与配置。
  tags: backup,exposure,zip
http:
  - method: GET
    path:
      - "{{BaseURL}}/backup.zip"
      - "{{BaseURL}}/backup.tar.gz"
      - "{{BaseURL}}/www.zip"
      - "{{BaseURL}}/web.zip"
      - "{{BaseURL}}/site.zip"
      - "{{BaseURL}}/data.zip"
      - "{{BaseURL}}/db.zip"
      - "{{BaseURL}}/database.sql"
      - "{{BaseURL}}/1.sql"
      - "{{BaseURL}}/bak.zip"
      - "{{BaseURL}}/code.zip"
    matchers-condition: or
    matchers:
      - type: word
        words: ["PK", "application/zip", "application/x-gzip", "text/plain"]
        part: all
      - type: regex
        regex: ["CREATE TABLE|INSERT INTO|DROP TABLE"]
    stop-at-first-match: true
---
