id: wvs-nacos-unauth
info:
  name: Nacos 未授权访问
  author: huocai250
  severity: high
  category: 未授权访问
  description: Nacos 用户列表接口未授权可访问，存在配置/凭据泄露风险。
  tags: nacos,unauthorized,exposure
  metadata:
    product: [nacos]
http:
  - method: GET
    path:
      - "{{BaseURL}}/nacos/v1/auth/users?pageNo=1&pageSize=9"
      - "{{BaseURL}}/nacos/v1/console/health/readiness"
    matchers-condition: or
    matchers:
      - type: word
        words: ["username", "password"]
        part: body
      - type: word
        words: ["Nacos"]
        part: body
    stop-at-first-match: true
---
