---
id: thinkphp-invoke-rce-surface
info:
  name: ThinkPHP 调试/入口暴露 (RCE 历史 CVE 面)
  severity: medium
  category: 配置错误
requests:
  - path: /?s=index/\think\app/invokefunction
    matchers-condition: or
    matchers:
      - type: word
        words: ["think\\", "ThinkPHP", "invokefunction"]
        condition: or
