id: wvs-phpunit-eval-stdin-cve-2017-9841
info:
  name: PHPUnit eval-stdin.php RCE (CVE-2017-9841)
  author: huocai250
  severity: critical
  category: 远程代码执行
  description: 向 eval-stdin.php POST 无害 PHP 表达式并匹配 md5 回显验证。
