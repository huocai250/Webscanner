id: spring-actuator-env
info:
  name: Spring Boot Actuator /env 暴露 (可能泄露凭据)
  severity: high
  category: 敏感信息泄露
requests:
  - paths:
      - /actuator/env
      - /env
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: word
        words: ["propertySources", "activeProfiles"]
        condition: or
---
id: spring-actuator-heapdump
info:
  name: Spring Boot Actuator heapdump 暴露 (严重)
  severity: critical
  category: 敏感信息泄露
requests:
  - paths:
      - /actuator/heapdump
      - /heapdump
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: header
        headers: ["Content-Type"]
---
id: druid-monitor
info:
  name: Alibaba Druid 监控页暴露
  severity: medium
  category: 信息泄露
requests:
