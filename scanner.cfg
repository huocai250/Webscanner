# WebVulnScanner v7.0 配置文件
# Author: 火柴 | GitHub: huocai250
# 命令行参数优先级 > 配置文件 > 默认值

[network]
threads    = 10
timeout    = 10
rate_limit = 0
max_retries = 2
# proxy = http://127.0.0.1:8080
# cookie = session=abc123
# user_agent = Mozilla/5.0

[exploit]
exploit       = false
exploit_types =
reverse_host  =
reverse_port  = 4444

[scan]
fast     = false
# only = sqli,xss,lfi
# wordlist = /path/to/wordlist.txt

[output]
log_level = INFO
# log_file    = scan.log
# output_json = report.json
# output_html = report.html
# output_csv  = report.csv

[webui]
# host = 0.0.0.0
# port = 5000
