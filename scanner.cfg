# WebVulnScanner v6.0 配置文件
# Author: 火柴 | GitHub: huocai250
# 命令行参数优先级 > 配置文件 > 默认值

[network]
# 并发线程数
threads = 10
# 请求超时秒数
timeout = 10
# 代理地址（留空不使用）
# proxy = http://127.0.0.1:8080
# Cookie 字符串
# cookie = session=abc123; token=xyz
# 自定义 User-Agent（留空使用默认）
# user_agent = Mozilla/5.0
# 请求间隔秒数（防封IP，0=不限制，建议0.5-2.0）
rate_limit = 0
# 最大重试次数
max_retries = 2

[exploit]
# 是否开启漏洞自动利用（true/false）
exploit = false
# 利用类型（留空=全部，可选: sqli,cmdi,xss,lfi）
exploit_types =
# 反弹Shell监听IP（留空不尝试反弹）
reverse_host =
# 反弹Shell监听端口
reverse_port = 4444

[scan]
# 快速模式（跳过耗时模块）
fast = false
# 只运行指定模块（留空=全部）
# only = sqli,xss,lfi
# 自定义目录字典
# wordlist = /path/to/wordlist.txt

[output]
# JSON 报告路径（留空不生成）
# output_json = report.json
# HTML 报告路径（留空自动生成）
# output_html = report.html
# CSV 报告路径（留空不生成）
# output_csv = report.csv
# 日志文件路径（留空不写文件）
# log_file = scan.log
# 日志级别: DEBUG / INFO / WARNING / ERROR
log_level = INFO
